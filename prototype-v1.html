<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PATH / FIELD - 可体验原型 v1</title>
    <style>
      :root {
        --paper: #f1e2b8;
        --paper-low: #e3cfa0;
        --ink: #1c2a23;
        --forest: #205a3e;
        --lake: #087b7d;
        --sun: #eca93d;
        --clay: #be6038;
        --deep: #142b27;
        --deep-2: #223e35;
        --line: rgba(28, 42, 35, .28);
        --light-line: rgba(241, 226, 184, .29);
      }
      * { box-sizing: border-box; }
      html { background: var(--deep); }
      body { background: var(--deep); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; letter-spacing: 0; margin: 0; }
      button { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      h1, h2, h3, p { margin: 0; }
      .prototype-stage { align-items: center; display: flex; justify-content: center; min-height: 100vh; padding: 24px; }
      .app { background: var(--paper); box-shadow: 0 28px 66px rgba(0,0,0,.3); min-height: 900px; overflow: hidden; position: relative; width: min(100%, 438px); }
      .app::before { border: 1px solid rgba(28,42,35,.36); content:""; inset: 9px; pointer-events: none; position:absolute; z-index: 20; }
      .view { display:none; min-height:900px; padding: 25px 27px 103px; position:relative; }
      .view.is-active { display:flex; flex-direction:column; }
      .deep-view { background: var(--deep); color: #edf0dc; }
      .deep-view::after { border-color: rgba(241,226,184,.23); }

      .topline { align-items:center; display:flex; font-family:"Avenir Next Condensed", "DIN Condensed", -apple-system, sans-serif; font-size: 12px; font-weight:760; justify-content:space-between; letter-spacing:.06em; text-transform:uppercase; }
      .brand { align-items:center; display:flex; gap:8px; }
      .tree { background:var(--forest); clip-path: polygon(50% 0,100% 57%,72% 57%,100% 100%,0 100%,28% 57%,0 57%); display:block; height:22px; width:20px; }
      .deep-view .tree { background:var(--sun); }
      .back-button { align-items:center; background:transparent; border:0; color:inherit; cursor:pointer; display:inline-flex; font-size:14px; gap:7px; padding:6px 0; }
      .back-button::before { border-bottom:1.5px solid currentColor; border-left:1.5px solid currentColor; content:""; height:7px; transform:rotate(45deg); width:7px; }

      .choose { background:var(--paper); padding-top:34px; }
      .choose h1 { font-size:40px; font-weight:820; line-height:1.06; margin-top:37px; }
      .choose h1 span { color:var(--forest); }
      .choose > p { color:#4e5f54; font-size:14px; line-height:1.65; margin-top:10px; }
      .state-list { border-top:1px solid var(--line); margin-top:31px; }
      .state-choice { background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--ink); cursor:pointer; display:grid; gap:13px; grid-template-columns:34px 1fr auto; padding:17px 0; text-align:left; width:100%; }
      .state-choice:hover, .state-choice:focus-visible { background:rgba(236,169,61,.16); outline:none; }
      .state-index { color:var(--forest); font-family:"Arial Narrow", "Avenir Next Condensed", -apple-system, sans-serif; font-size:16px; font-weight:800; }
      .state-choice b { display:block; font-size:17px; font-weight:800; }
      .state-choice span { color:#536359; display:block; font-size:12px; line-height:1.45; margin-top:3px; }
      .choice-arrow { align-self:center; border-right:1.5px solid var(--forest); border-top:1.5px solid var(--forest); height:9px; transform:rotate(45deg); width:9px; }
      .choose-note { border-top:2px solid var(--sun); color:#4b5b51; font-size:13px; line-height:1.55; margin-top:auto; padding:12px 0 0; }

      .calibrate h1 { color:var(--paper); font-size:34px; font-weight:810; line-height:1.1; margin-top:31px; }
      .calibrate > p { color:#bdc8b2; font-size:14px; line-height:1.6; margin-top:9px; }
      .state-readout { border-bottom:1px solid var(--light-line); border-top:1px solid var(--light-line); margin-top:25px; padding:15px 0; }
      .state-readout b { color:var(--sun); display:block; font-size:12px; }
      .state-readout span { color:#edf0dc; display:block; font-size:15px; font-weight:700; line-height:1.45; margin-top:4px; }
      .calibrate h2 { color:var(--paper); font-size:18px; font-weight:780; margin-top:26px; }
      .chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
      .chip { background:var(--deep-2); border:1px solid rgba(241,226,184,.35); color:#e8edd9; cursor:pointer; font-size:13px; padding:10px 11px; }
      .chip[aria-pressed="true"] { background:var(--sun); border-color:var(--sun); color:var(--ink); font-weight:780; }
      .safety-question { border-bottom:1px solid var(--light-line); border-top:1px solid var(--light-line); margin-top:24px; padding:18px 0; }
      .safety-question b { color:var(--paper); display:block; font-size:16px; line-height:1.4; }
      .safety-question span { color:#bdc8b2; display:block; font-size:12px; line-height:1.5; margin-top:6px; }
      .dual-action { display:grid; gap:1px; grid-template-columns:1fr 1fr; margin-top:14px; }
      .dual-action button { background:#29473c; border:0; color:#e5ead8; cursor:pointer; font-size:13px; padding:13px 10px; }
      .dual-action button.selected, .dual-action button:hover, .dual-action button:focus-visible { background:var(--sun); color:var(--ink); outline:none; }
      .primary { background:var(--forest); border:0; color:var(--paper); cursor:pointer; font-size:15px; font-weight:790; padding:16px; text-align:left; width:100%; }
      .primary:hover, .primary:focus-visible { background:var(--ink); outline:3px solid rgba(236,169,61,.62); outline-offset:2px; }
      .deep-view .primary { background:var(--sun); color:var(--ink); }
      .deep-view .primary:hover, .deep-view .primary:focus-visible { background:#f5c267; }
      .sticky-action { margin-top:auto; padding-top:20px; }

      .today h1 { font-size:35px; font-weight:820; line-height:1.08; margin-top:29px; }
      .today h1 span { color:var(--forest); }
      .today-intro { color:#4c5f53; font-size:14px; line-height:1.58; margin-top:8px; }
      .route-field { background:var(--lake); height:158px; margin:21px -27px 0; overflow:hidden; position:relative; }
      #route-canvas { height:100%; width:100%; }
      .route-label { background:var(--paper); bottom:15px; font-size:12px; font-weight:770; left:27px; padding:9px 10px; position:absolute; }
      .route-label span { color:#56655b; font-weight:600; }
      .mission { border-bottom:1px solid var(--line); padding:21px 0 17px; }
      .kicker { color:var(--forest); font-size:12px; font-weight:790; }
      .mission h2 { font-size:22px; font-weight:800; line-height:1.2; margin-top:6px; }
      .mission p { color:#4e5e54; font-size:13px; line-height:1.55; margin-top:5px; }
      .reason { border-bottom:1px solid var(--line); display:grid; gap:11px; grid-template-columns:16px 1fr; padding:13px 0; }
      .reason-mark { border:1.5px solid var(--forest); border-radius:50%; height:14px; margin-top:3px; position:relative; width:14px; }
      .reason.observation .reason-mark::after { background:var(--sun); border-radius:50%; content:""; height:5px; position:absolute; right:-3px; top:-3px; width:5px; }
      .reason.decision .reason-mark { border-radius:0; transform:rotate(45deg); }
      .reason b { color:var(--forest); display:block; font-size:12px; }
      .reason span { display:block; font-size:13px; line-height:1.45; margin-top:3px; }
      .choice-actions { display:grid; gap:1px; grid-template-columns:1fr 1fr; margin-top:1px; }
      .choice-actions button { background:var(--paper-low); border:0; color:var(--ink); cursor:pointer; font-size:13px; padding:14px 11px; text-align:left; }
      .choice-actions button:hover, .choice-actions button:focus-visible { background:var(--sun); outline:none; }
      .support-link { background:transparent; border:0; color:#7f3a2c; cursor:pointer; font-size:13px; margin-top:15px; padding:0; text-decoration:underline; text-underline-offset:3px; }

      .training-main { padding-top:30px; }
      .training-main h1 { color:var(--paper); font-size:42px; font-weight:820; line-height:1; }
      .training-main > p { color:#bdc8b2; font-size:13px; line-height:1.52; margin-top:8px; }
      .goal { border-bottom:1px solid var(--light-line); border-top:1px solid var(--light-line); display:grid; gap:8px; grid-template-columns:1fr 1fr; margin-top:25px; padding:16px 0; }
      .goal b { color:var(--sun); display:block; font-size:11px; }
      .goal span { color:var(--paper); display:block; font-size:16px; font-weight:760; margin-top:3px; }
      .sets { display:flex; gap:7px; margin:22px 0 10px; }
      .sets button { background:transparent; border:1px solid rgba(241,226,184,.42); color:#e8edd8; cursor:pointer; font-size:12px; height:29px; width:29px; }
      .sets button.is-done { background:var(--forest); border-color:var(--forest); }
      .sets button.is-current { background:var(--sun); border-color:var(--sun); color:var(--ink); font-weight:800; }
      .set-copy { color:#bdc8b2; font-size:13px; }
      .adjustment-note { border-left:2px solid var(--sun); color:#e8edd9; font-size:13px; line-height:1.45; margin:14px 0 -2px; padding-left:10px; }
      .measurements { border-top:1px solid var(--light-line); margin-top:17px; }
      .measure { align-items:center; border-bottom:1px solid rgba(241,226,184,.21); display:grid; gap:10px; grid-template-columns:1fr auto auto auto; min-height:78px; }
      .measure span { color:#cbd3c0; font-size:13px; }
      .measure output { color:var(--paper); font-size:27px; font-variant-numeric:tabular-nums; font-weight:790; min-width:84px; text-align:right; }
      .measure button { background:transparent; border:1px solid rgba(241,226,184,.42); color:var(--paper); cursor:pointer; font-size:19px; height:35px; width:35px; }
      .measure button:hover, .measure button:focus-visible { background:var(--forest); border-color:var(--forest); outline:none; }
      .effort { border-bottom:1px solid rgba(241,226,184,.21); padding:17px 0 18px; }
      .effort > span { color:#cbd3c0; display:block; font-size:13px; margin-bottom:9px; }
      .effort-controls { display:grid; gap:1px; grid-template-columns:repeat(3,1fr); }
      .effort-controls button { background:#253f36; border:0; color:#e1e7d5; cursor:pointer; font-size:13px; padding:11px 7px; }
      .effort-controls button[aria-pressed="true"] { background:var(--sun); color:var(--ink); font-weight:790; }
      .training-tools { display:grid; gap:1px; grid-template-columns:1fr 1fr; margin-top:1px; }
      .training-tools button { background:#29473c; border:0; color:#e4ead8; cursor:pointer; font-size:13px; padding:14px 10px; text-align:left; }
      .training-tools button:hover, .training-tools button:focus-visible { background:#3a594b; outline:none; }

      .journey h1, .review h1, .commit h1, .support h1 { font-size:34px; font-weight:820; line-height:1.1; margin-top:32px; }
      .journey h1 span, .review h1 span, .commit h1 span { color:var(--forest); }
      .journey > p, .review > p, .commit > p, .support > p { color:#4f6055; font-size:14px; line-height:1.6; margin-top:9px; }
      .mission-stamp { background:var(--forest); color:var(--paper); margin:27px -27px 0; padding:23px 27px; }
      .mission-stamp b { color:var(--sun); display:block; font-size:12px; }
      .mission-stamp h2 { font-size:23px; font-weight:800; line-height:1.2; margin-top:6px; }
      .mission-stamp p { color:#dce4d1; font-size:13px; line-height:1.52; margin-top:5px; }
      .route-list { border-top:1px solid var(--line); margin-top:24px; }
      .route-item { border-bottom:1px solid var(--line); padding:15px 0; }
      .route-item b { color:var(--forest); display:block; font-size:12px; }
      .route-item span { display:block; font-size:14px; line-height:1.45; margin-top:4px; }
      .review-receipt { border-bottom:1px solid var(--line); border-top:1px solid var(--line); margin-top:25px; padding:6px 0; }
      .review-row { align-items:flex-start; border-bottom:1px solid var(--line); display:grid; gap:11px; grid-template-columns:14px 1fr; padding:15px 0; }
      .review-row:last-child { border-bottom:0; }
      .review-row .review-dot { border:1.5px solid var(--forest); border-radius:50%; height:13px; margin-top:3px; position:relative; width:13px; }
      .review-row.observation .review-dot::after { background:var(--sun); border-radius:50%; content:""; height:5px; position:absolute; right:-3px; top:-3px; width:5px; }
      .review-row.unknown .review-dot { border-radius:0; transform:rotate(45deg); }
      .review-row b { color:var(--forest); display:block; font-size:12px; }
      .review-row span { display:block; font-size:14px; line-height:1.48; margin-top:3px; }
      .decision-list { border-top:1px solid var(--line); margin-top:25px; }
      .decision-option { background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--ink); cursor:pointer; display:grid; gap:10px; grid-template-columns:16px 1fr; padding:15px 0; text-align:left; width:100%; }
      .decision-option i { border:1.5px solid var(--forest); border-radius:50%; height:14px; margin-top:4px; position:relative; width:14px; }
      .decision-option[aria-pressed="true"] i::after { background:var(--sun); border-radius:50%; content:""; height:8px; left:2px; position:absolute; top:2px; width:8px; }
      .decision-option b { display:block; font-size:16px; font-weight:790; }
      .decision-option span { color:#526259; display:block; font-size:13px; line-height:1.45; margin-top:3px; }
      .decision-evidence { border-bottom:1px solid var(--line); border-top:1px solid var(--line); margin-top:25px; padding:14px 0 1px; }
      .decision-evidence h2 { font-size:16px; font-weight:790; line-height:1.35; }
      .decision-evidence h3 { color:var(--forest); font-size:12px; font-weight:790; margin:16px 0 4px; }
      .decision-evidence p { color:#526259; font-size:13px; line-height:1.5; margin:0 0 12px; }
      .commit .seal { background:var(--lake); color:var(--paper); margin:33px -27px 0; min-height:190px; padding:28px 27px; position:relative; }
      .commit .seal::after { border:1px solid rgba(241,226,184,.45); content:""; inset:13px; pointer-events:none; position:absolute; }
      .seal b { color:var(--sun); display:block; font-size:12px; position:relative; z-index:1; }
      .seal h2 { font-size:27px; font-weight:820; line-height:1.08; margin-top:7px; position:relative; z-index:1; }
      .seal p { color:#e2ead7; font-size:13px; line-height:1.5; margin-top:8px; position:relative; z-index:1; }
      .support { justify-content:center; }
      .support h1 { color:var(--paper); }
      .support > p { color:#c2ccb7; }
      .support .support-rules { border-bottom:1px solid var(--light-line); border-top:1px solid var(--light-line); margin-top:28px; }
      .support .support-rules div { border-bottom:1px solid rgba(241,226,184,.2); color:#e7edda; font-size:14px; line-height:1.5; padding:15px 0; }
      .support .support-rules div:last-child { border-bottom:0; }

      .bottom-nav { align-items:stretch; background:rgba(241,226,184,.97); border-top:1px solid var(--line); bottom:0; display:grid; grid-template-columns:repeat(4,1fr); left:0; padding:7px 17px 14px; position:absolute; right:0; z-index:18; }
      .bottom-nav button { background:transparent; border:0; color:#5b695f; cursor:pointer; font-size:11px; padding:11px 4px 7px; }
      .bottom-nav button.is-active { color:var(--forest); font-weight:800; }
      .bottom-nav button:focus-visible { outline:2px solid var(--sun); outline-offset:-2px; }
      .deep-view ~ .bottom-nav { background:var(--deep); border-color:var(--light-line); }
      .deep-view ~ .bottom-nav button { color:#bdc8b2; }
      .deep-view ~ .bottom-nav button.is-active { color:var(--sun); }
      .sheet { background:var(--paper); border-top:3px solid var(--clay); bottom:0; box-shadow:0 -15px 36px rgba(0,0,0,.22); display:none; left:0; padding:26px 27px 34px; position:absolute; right:0; z-index:25; }
      .sheet.is-open { display:block; }
      .sheet h2 { font-size:21px; font-weight:810; }
      .sheet p { color:#4f5f55; font-size:14px; line-height:1.6; margin-top:8px; }
      .sheet button { background:var(--forest); border:0; color:var(--paper); cursor:pointer; font-size:14px; font-weight:780; margin-top:18px; padding:12px 14px; }
      .sheet .sheet-option { display:block; margin-top:1px; text-align:left; width:100%; }
      .sheet .sheet-option:first-of-type { margin-top:18px; }
      .sheet .sheet-secondary { background:var(--paper-low); color:var(--ink); }
      @media(max-width:520px) { .prototype-stage{display:block;padding:0}.app{min-height:100vh;width:100%}.view{min-height:100vh}.choose h1{font-size:37px}.route-field{height:150px} }
    </style>
  </head>
  <body>
    <!--
      THESIS: The prototype proves an adaptive training decision loop from entry to user-confirmed next stage; it refuses a course catalog, streak system, or opaque AI coach.
      OWN-WORLD: The selected national-park field language becomes operating UI: paper, fir and deep-green states, small terrain routing, precise evidence lines, and a stage print only after review.
      STORY: A user selects their real state, passes a safety check, receives a reasoned training option, records it, separates evidence from uncertainty, and chooses the next route.
      FIRST VIEWPORT: A state-choice field opens immediately, so the product begins with the user's present condition rather than a generic dashboard.
      FORM: Interactive mobile-first end-to-end prototype for three state paths; seed 6179fda8.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <main class="prototype-stage">
      <section class="app" aria-label="PATH FIELD 健身成长系统可体验原型">
        <section class="view choose is-active" data-view="choose"></section>
        <section class="view deep-view calibrate" data-view="calibrate"></section>
        <section class="view today" data-view="today"></section>
        <section class="view deep-view training" data-view="training"></section>
        <section class="view journey" data-view="journey"></section>
        <section class="view review" data-view="review"></section>
        <section class="view commit" data-view="commit"></section>
        <section class="view deep-view support" data-view="support"></section>
        <nav class="bottom-nav" aria-label="原型导航">
          <button type="button" data-nav="today">今天</button><button type="button" data-nav="training">训练</button><button type="button" data-nav="journey">旅程</button><button type="button" data-nav="review">复盘</button>
        </nav>
        <aside class="sheet" id="risk-sheet" aria-live="polite"></aside>
      </section>
    </main>
    <script src="./prototype-data-v1.js"></script>
    <script>
      const fallback = {
        personas: {

        const evidenceRows = (decision.evidence || []).map((item) => `<p>${escapeHtml(item)}</p>`).join('') || '<p>这条路线需要在下一次训练后补充更多记录。</p>';
        const unknownRows = (decision.unknowns || []).map((item) => `<p>${escapeHtml(item)}</p>`).join('') || '<p>暂无额外待确认项。</p>';
        el.innerHTML=`${renderTopline("REVIEW", "记录与解释")}<h1>发生了什么，<br>和它<span>可能意味着什么。</span></h1><p>系统不把单个数字包装成答案。先看事实，再看观察和仍需验证的部分。</p><section class="review-receipt">${reviewRows('fact',p.review.facts)}${reviewRows('observation',p.review.observations)}${reviewRows('unknown',p.review.unknowns)}</section><section class="decision-list"><div class="kicker" style="margin:17px 0 3px">下一段的候选路线</div>${p.decisions.map((item,index)=>`<button class="decision-option" data-decision="${index}" aria-pressed="${appState.decision===index}" type="button"><i aria-hidden="true"></i><span><b>${escapeHtml(item.title)}</b><span>${escapeHtml(item.description)}</span></span></button>`).join('')}</section><section class="decision-evidence"><h2>这条路线依据了什么</h2>${evidenceRows}<h3>还需要确认什么</h3>${unknownRows}</section><div class="sticky-action"><button class="primary" id="confirm-decision" type="button">确认这条下一步</button></div>`;
        el.querySelectorAll('[data-decision]').forEach((button)=>button.addEventListener('click',()=>{appState.decision=Number(button.dataset.decision);renderReview();}));
        el.querySelector('#confirm-decision').addEventListener('click',()=>go('commit'));
      }
      function renderCommit() { const p=getPersona(); const decision=p.decisions[appState.decision]||p.decisions[0]; const el=document.querySelector('[data-view="commit"]'); el.innerHTML=`${renderTopline("NEXT", "由你确认")}<h1>下一段路，<br>已经<span>写入计划。</span></h1><p>这不是不可更改的承诺。下一次训练、时间变化或新的体感都可以让它重新被讨论。</p><section class="seal"><b>你的下一步</b><h2>${escapeHtml(decision.title)}</h2><p>${escapeHtml(decision.description)}</p></section><section class="route-list"><div class="route-item"><b>系统会记住</b><span>当前选择以及支持它的训练证据。</span></div><div class="route-item"><b>系统不会假装知道</b><span>${escapeHtml(p.mission.notJudge)}</span></div></section><div class="sticky-action"><button class="primary" data-go="today" type="button">回到今天</button></div>`; el.querySelector('[data-go]').addEventListener('click',()=>go('today')); }
      function renderSupport() { const el=document.querySelector('[data-view="support"]');el.innerHTML=`${renderTopline("SAFE", "暂停训练建议")}<h1>今天先不要<br>用训练证明什么。</h1><p>你报告的情况需要优先于任何训练计划。产品不能诊断原因，也不会用完成度、积分或激励催促你继续。</p><section class="support-rules"><div>停止本次高强度训练建议。</div><div>你可以保留记录，方便之后重新说明限制。</div><div>症状持续、加重或让你担心时，请寻求适合的专业支持。</div></section><div class="sticky-action"><button class="primary" data-go="choose" type="button">回到状态选择</button></div>`; el.querySelector('[data-go]').addEventListener('click',()=>go('choose')); }
      function openRiskSheet() { const sheet=document.querySelector('#risk-sheet');sheet.innerHTML=`<h2>先暂停高强度训练。</h2><p>疼痛、持续不适或异常疲劳不应被当作完成训练的代价。你可以记录它、选择恢复活动，或在需要时咨询合适的专业人士。</p><button data-close-sheet type="button">我知道了</button>`;sheet.classList.add('is-open');sheet.querySelector('[data-close-sheet]').addEventListener('click',()=>sheet.classList.remove('is-open')); }
      function openAdjustmentSheet() { const sheet=document.querySelector('#risk-sheet');sheet.innerHTML=`<h2>记录一个调整</h2><p>训练中的调整不是失败。系统会保留原计划、调整类型和原因，供下次复盘时解释。</p><button class="sheet-option" data-adjustment="换成等价动作" type="button">换成等价动作</button><button class="sheet-option sheet-secondary" data-adjustment="跳过并记录原因" type="button">跳过并记录原因</button>`;sheet.classList.add('is-open');sheet.querySelectorAll('[data-adjustment]').forEach((button)=>button.addEventListener('click',()=>{appState.adjustment=button.dataset.adjustment; sheet.classList.remove('is-open'); renderTraining();})); }
      function render(view) { if(view==='choose') return renderChoose(); if(view==='calibrate') return renderCalibrate(); if(view==='today') return renderToday(); if(view==='training') return renderTraining(); if(view==='journey') return renderJourney(); if(view==='review') return renderReview(); if(view==='commit') return renderCommit(); if(view==='support') return renderSupport(); }
      nav.forEach((button)=>button.addEventListener('click',()=>{ if(!appState.persona) return go('choose'); if(button.dataset.nav==='training' && appState.view!=='training') { appState.plan='full'; appState.currentSet=3; appState.adjustment=null; return go('training'); } go(button.dataset.nav); }));
      renderChoose();
    </script>
  </body>
</html>
